<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Funcionários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Sidebar lateral  -->
        <aside class="sidebar">
            <div class="brand-logo">◆</div>
            <!--nav class="nav-steps">
                <div class="step-icon active">1</div>
                <div class="step-icon">2</div>
                <div class="step-icon">3</div>
            </nav-->
        </aside>

        <!-- Conteúdo principal -->
        <main class="main-content">
            <header class="content-header">
                <h1>Gestão de Funcionários</h1>
            </header>

            <!-- Formulário -->
            <section class="form-section">
                <h2>Cadastrar / Atualizar Funcionário</h2>
                <form id="form-funcionario">
                    <input type="hidden" id="funcionario-id">

                    <div class="field-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Digite o nome" required>
                    </div>

                    <div class="field-group">
                        <label for="cargo">Cargo na empresa</label>
                        <input type="text" id="cargo" placeholder="Ex: Desenvolvedor" required>
                    </div>

                    <div class="field-group">
                        <label for="salario">Salário (R$)</label>
                        <input type="number" step="0.01" id="salario" placeholder="Ex: 3500.00" required>
                    </div>

                    <button type="submit" class="btn-primary" id="btn-salvar">Salvar Funcionário</button>
                </form>
            </section>

            <!-- Tabela de Listagem -->
            <section class="table-section">
                <h2>Lista de Funcionários</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Cargo</th>
                                <th>Salário</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-funcionarios">
                            <!-- Inserido dinamicamente via script.js -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
